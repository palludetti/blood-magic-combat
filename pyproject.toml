[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-magic-combat"
version = "0.1.0"
description = "Turn-based combat system powered by blood magic with Supabase PostgreSQL atomic transactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "supabase>=2.33.0",
    "postgrest>=2.33.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

